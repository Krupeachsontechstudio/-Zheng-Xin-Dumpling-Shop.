<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf5ea; --dough:#f6ead6; --bamboo:#d9b26f; --bamboo-d:#a97c3c; --soy:#4a2f22; --soy-2:#6e4a36;
  --red:#c8402f; --red-d:#9e2c1f; --green:#5f9a5a; --amber:#e0a43a; --ink:#2b1d16; --muted:#8a6f5d; --line:#e6d4b6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Noto Sans Thai","Noto Sans TC",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 0%,#fffaf1 0,transparent 55%),linear-gradient(#f6ecdb,#ecdcc0);
  min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
.screen{display:none;min-height:100vh}
.screen.on{display:flex}
.serif{font-family:"Noto Serif TC",serif}

/* ---------- language switch ---------- */
.langs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.langs button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button.on{background:var(--soy);color:#fff}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center;padding:24px}
.card{background:var(--cream);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px -20px rgba(74,47,34,.45)}
.title-card{max-width:560px;width:100%;padding:34px 30px 28px;text-align:center;position:relative;overflow:hidden}
.title-card .langs{position:absolute;top:16px;right:16px}
.setbox{margin-top:10px}
.set-head{font-size:14px;margin-bottom:4px}
.set-lbl{font-size:13px;font-weight:700;margin-top:10px}
.mins.two{grid-template-columns:repeat(2,1fr);max-width:240px}
.setbox .muted{margin:8px 0 0}
.modal{position:fixed;inset:0;background:rgba(43,29,22,.45);display:grid;place-items:center;z-index:80;padding:16px}
.modal[hidden]{display:none}
.modal-card{width:100%;max-width:440px;padding:22px}
.modal-card h2{margin:0 0 12px;color:var(--soy);font-size:22px}
.set-block{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.set-block b{font-size:14px}
.mins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.mchip{border:1px solid var(--line);background:var(--cream);border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px}
.mchip.on{background:var(--red);border-color:var(--red);color:#fff}
.pausedNote{display:none;margin:6px 0 0;font-weight:700;color:var(--red-d);font-size:13px}
.modal.ingame .pausedNote{display:block}
.brow .sc i{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.brow .sc small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.logo{position:relative;display:inline-flex;align-items:center;gap:14px;margin:18px 0 4px}
.logo h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(68px,16vw,104px);letter-spacing:.06em;color:var(--soy);line-height:1}
.seal{width:44px;height:44px;background:var(--red);color:#fff;border-radius:6px;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:13px;line-height:1.05;writing-mode:vertical-rl;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.sub{color:var(--muted);letter-spacing:.18em;font-size:13px;font-weight:600;text-transform:uppercase}
.tagline{font-size:18px;margin:10px 0 18px;color:var(--soy-2)}
.hero-art{display:flex;justify-content:center;gap:4px;margin:4px 0 6px;position:relative}
.hero-art svg{filter:drop-shadow(0 6px 8px rgba(74,47,34,.2))}
.howto{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:16px 0 18px}
.howto h3{margin:0 0 8px;font-size:15px;color:var(--soy)}
.howto ol{margin:0;padding-left:20px;font-size:14.5px;line-height:1.6}
.howto li{margin:3px 0}
.howto .tip{font-size:12.5px;color:var(--muted);margin-top:8px}
.big-btn{border:0;background:var(--red);color:#fff;font-weight:800;font-size:19px;padding:14px 36px;border-radius:14px;box-shadow:0 5px 0 var(--red-d);transition:transform .08s}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.ghost-btn{border:1px solid var(--line);background:#fff;padding:12px 22px;border-radius:12px;font-weight:600}

/* ---------- game ---------- */
#game{flex-direction:column;max-width:1080px;margin:0 auto;padding:12px;gap:12px;position:relative}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{font-family:"Noto Serif TC",serif;font-weight:900;font-size:26px;color:var(--soy);margin-right:4px;display:flex;align-items:center;gap:8px}
.brand .seal{width:26px;height:26px;font-size:8px;border-radius:4px}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;line-height:1.15;min-width:70px}
.chip small{font-size:11px;color:var(--muted);font-weight:600}
.chip b{font-size:17px}
.chip.target{min-width:150px}
.tbar{height:6px;background:#f0e3cc;border-radius:9px;margin-top:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--green);width:0;border-radius:9px;transition:width .3s}
.hearts{color:var(--red);letter-spacing:1px;font-size:16px}
.hearts .off{color:#dccbb2}
.hud .spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}

.panel{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:12px}
.panel h2{margin:0 0 8px;font-size:13px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:800}

/* counter / seats */
.counter{background:linear-gradient(#8a5a36,#6e4429);border-radius:18px;padding:12px 12px 16px;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.counter::before{content:"";position:absolute;inset:0;border-radius:18px;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.04) 60px 62px);pointer-events:none}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.seat{background:rgba(255,248,236,.96);border-radius:14px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;min-height:168px;position:relative;cursor:pointer;transition:transform .12s,border-color .12s}
.seat.empty{background:rgba(255,248,236,.18);border:2px dashed rgba(255,248,236,.35);color:rgba(255,248,236,.7);justify-content:center;cursor:default;font-size:13px}
.seat.match{border-color:var(--green);box-shadow:0 0 0 4px rgba(95,154,90,.3);animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.bubble{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 6px 5px;display:flex;flex-direction:column;align-items:center;width:100%;position:relative}
.bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble .nm{font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.bubble .pr{font-size:11px;color:var(--muted)}
.face{width:58px;height:58px}
.pbar{width:88%;height:7px;background:#eadbc2;border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--green);border-radius:9px}

/* work area */
.work{display:grid;grid-template-columns:1fr 1.15fr;gap:12px}
.menu-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mbtn{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;text-align:left;line-height:1.15}
.mbtn small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.mbtn.on{border-color:var(--soy);background:#fff6e8}
.foldzone{position:relative;background:radial-gradient(circle at 50% 60%,#fff 0,#f7ecd9 70%);border:1px solid var(--line);border-radius:16px;height:280px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;overflow:hidden}
.foldzone{touch-action:none}
.foldzone #foldArt{width:250px;display:flex;justify-content:center;margin-top:-10px}
#stage{width:100%;height:auto;display:block;transition:transform .06s;overflow:visible}
#stage .rot{transform-origin:150px 150px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
#stage.squish{animation:squish .24s}
@keyframes squish{30%{transform:scale(1.05,.94)}70%{transform:scale(.98,1.02)}}
.guide{animation:guide 1.2s ease-out infinite}
@keyframes guide{0%{transform:translateY(8px);opacity:0}35%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.foldzone.dragging .guide{display:none}
.doneimg{width:190px;animation:pop .4s}
.doneimg .dimg{width:100%}
.foldzone .dimg{width:100%;transition:transform .08s}
.foldzone.bump .dimg{transform:scale(.93) rotate(-3deg)}
.foldzone .tag{font-size:24px;padding:5px}
.foldzone .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.foldzone .count{position:absolute;top:10px;right:12px;background:var(--soy);color:#fff;border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px}
.foldzone.disabled{cursor:default}
.foldzone.disabled .dimg{opacity:.45}

.steamers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.steamer{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative}
.basket{width:112px;height:112px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle,#f3e2bd 0 54%,transparent 55%),repeating-conic-gradient(#d9b26f 0 6deg,#c99d55 6deg 12deg);
  box-shadow:inset 0 0 0 5px #b8893f,0 4px 0 #a97c3c}
.basket .dimg{width:72px;position:relative;z-index:1}
.steamer.empty .basket{opacity:.55}
.steamer.ok .basket{box-shadow:inset 0 0 0 5px #b8893f,0 4px 0 #a97c3c,0 0 0 5px rgba(95,154,90,.45)}
.steamer.ok{border-color:var(--green)}
.steamer.burnt .basket{filter:grayscale(.7) brightness(.85)}
.steam{position:absolute;inset:-26px 0 auto 0;height:40px;pointer-events:none;z-index:2}
.steam span{position:absolute;bottom:0;width:10px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);filter:blur(4px);opacity:0;animation:rise 1.8s infinite}
.steam span:nth-child(1){left:36%}
.steam span:nth-child(2){left:50%;animation-delay:.6s}
.steam span:nth-child(3){left:62%;animation-delay:1.2s}
.steamer.empty .steam{display:none}
@keyframes rise{0%{opacity:0;transform:translateY(16px) scale(.6)}30%{opacity:.85}100%{opacity:0;transform:translateY(-18px) scale(1.4)}}
.gauge{width:100%;height:12px;border-radius:9px;display:flex;overflow:visible;position:relative;background:#eee}
.gauge .z{height:100%}
.gauge .raw{width:50%;background:#e2d6c4;border-radius:9px 0 0 9px}
.gauge .okz{width:25%;background:#9cc795}
.gauge .ovz{width:25%;background:#f0c37a;border-radius:0 9px 9px 0}
.needle{position:absolute;top:-4px;width:4px;height:20px;background:var(--soy);border-radius:3px;left:0;margin-left:-2px}
.steamer.empty .needle{display:none}
.slabel{font-size:12px;font-weight:700;text-align:center;min-height:16px;line-height:1.2}

.handrow{display:flex;gap:10px;align-items:stretch;margin-top:10px}
.hand{flex:1;background:#fff;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:66px}
.hand.full{border-style:solid;border-color:var(--green);background:#f5fbf3}
.hand .dimg{width:58px}
.hand small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.hand b{font-size:14px}
.trash{border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 16px;font-weight:700;color:var(--red-d)}

#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-30px);background:var(--soy);color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .2s;z-index:50;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
#toast.good{background:var(--green)}
.floater{position:fixed;font-weight:900;font-size:22px;color:var(--green);pointer-events:none;z-index:60;animation:floatUp 1s forwards;text-shadow:0 2px 0 #fff}
@keyframes floatUp{to{transform:translateY(-50px);opacity:0}}
.timewarn b{color:var(--red)}

/* ---------- shop / end ---------- */
#shop,#end{align-items:flex-start;justify-content:center;padding:24px 14px}
.shop-card{max-width:760px;width:100%;padding:24px}
.shop-card h2{margin:0;font-family:"Noto Serif TC","Noto Sans Thai",serif;font-size:28px;color:var(--soy)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.summary div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.summary small{display:block;color:var(--muted);font-size:12px}
.summary b{font-size:20px}
.passed{display:inline-block;background:var(--green);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;margin-left:8px;vertical-align:middle}
.shop-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.shop-head h3{margin:0;font-size:17px}
.wallet{font-weight:800;font-size:18px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.sitem .ic{width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--dough);border-radius:12px;font-size:24px}
.sitem .ic .dimg{width:44px}
.sitem .tx{flex:1;min-width:0}
.sitem b{display:block;font-size:14px}
.sitem small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.buy{border:0;background:var(--soy);color:#fff;border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.buy[disabled]{background:#d8c8b1;cursor:not-allowed}
.buy.owned{background:var(--green)}
.actions{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.end-card{max-width:520px;width:100%;padding:30px 24px;text-align:center}
.end-card .emoji svg{width:150px;height:auto}
.end-card h2{font-family:"Noto Serif TC","Noto Sans Thai",serif;color:var(--soy);font-size:26px;margin:10px 0 6px}
.end-card p{color:var(--soy-2);margin:4px 0}
.note{font-size:13px;color:var(--green);font-weight:700;margin-top:6px}

/* dumpling images */
.dimg{position:relative;display:inline-block;width:80px;line-height:0;vertical-align:middle;flex:none}
.dimg img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 5px rgba(74,47,34,.22))}
.dimg .tag{position:absolute;right:-5px;top:-5px;font-style:normal;font-size:13px;line-height:1;background:#fff;border-radius:50%;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mbtn .tag,.bubble .tag{font-size:10px;padding:2px;right:-6px;top:-6px}
.dimg.fold .ghost{filter:grayscale(1) brightness(1.1);opacity:.35}
.dimg.fold .fill{position:absolute;left:0;top:0;transition:clip-path .12s}
.dimg.fold.done{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.12)}}
.dimg.raw img{filter:saturate(.3) brightness(1.15);opacity:.8}
.dimg.over img{filter:sepia(.55) saturate(1.4) brightness(.9)}
.dimg.burnt img{filter:grayscale(.8) brightness(.5) contrast(1.2)}
.dimg.burnt::after{content:"💥";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:26px;line-height:1}
/* badge images */
.badge{display:block;border-radius:50%;filter:drop-shadow(0 10px 16px rgba(74,47,34,.28))}
.hero-badges{display:flex;justify-content:center;align-items:center;margin:2px 0 4px}
.hero-badges .badge{width:min(210px,42vw);animation:bob 3.2s ease-in-out infinite}
.hero-badges .badge:first-child{transform:rotate(-6deg);margin-right:-18px;z-index:1}
.hero-badges .badge:last-child{transform:rotate(6deg);animation-delay:-1.6s}
@keyframes bob{50%{translate:0 -8px}}
.brand img{width:38px;height:38px;border-radius:50%}
.foldzone .bgbadge{position:absolute;width:210px;height:210px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);opacity:.07;pointer-events:none;border-radius:50%}
.foldzone #foldArt{position:relative}
.counter .hang{position:absolute;top:-14px;width:46px;height:46px;border-radius:50%;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.counter .hang.l{left:-10px;transform:rotate(-10deg)} .counter .hang.r{right:-10px;transform:rotate(10deg)}
.shop-title{display:flex;align-items:center;gap:12px}
.shop-title img{width:64px;height:64px;border-radius:50%}
.end-badges{display:flex;justify-content:center}
.end-badges img{width:170px}
.end-badges img+img{margin-left:-24px;transform:rotate(6deg)}
.end-badges.sad img{filter:grayscale(.85) brightness(.95);transform:rotate(-12deg)}
.mbtn img{width:30px;height:30px;border-radius:50%}
@media (max-width:760px){
  .brand img{width:30px;height:30px}
  .foldzone .bgbadge{width:170px;height:170px}
  .foldzone #foldArt{width:220px}
  .doneimg{width:160px}
  .end-badges img{width:130px}
}
/* account & board */
.auth{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.acct-head{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.acct-head b{display:block;font-size:14px}
.acct-head small{display:block;font-size:12px;line-height:1.35;color:var(--muted)}
.acct-head small.ok{color:var(--green)} .acct-head small.warn{color:#b07020}
.nickrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.nickrow label{font-size:13px;font-weight:700}
.nickrow input{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:var(--cream);user-select:text;-webkit-user-select:text}
.ghost-btn.sm{padding:7px 12px;font-size:13px}
.big-btn.alt{background:var(--soy);box-shadow:0 5px 0 #2b1a12}
.rankline{text-align:center;font-weight:800;color:var(--soy);margin:14px 0 0}
#board{align-items:flex-start;justify-content:center;padding:24px 14px}
#boardCard h2{margin:12px 0 2px}
.muted{color:var(--muted)} .small{font-size:13px;margin-top:2px}
.dates{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;margin:6px 0 4px;scrollbar-width:thin}
.dchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.dchip.on{background:var(--red);border-color:var(--red);color:#fff}
.blist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.blist p{padding:22px;text-align:center;margin:0}
.brow{display:grid;grid-template-columns:44px 1fr 120px 64px;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid #f1e6d4;font-size:14px}
.brow.head{border-top:0;background:var(--dough);font-size:12px;font-weight:800;color:var(--muted)}
.brow.me{background:#fff4e2;font-weight:700}
.brow .rk{font-weight:800;text-align:center;font-size:16px}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm em{font-style:normal;color:var(--red);font-size:12px}
.brow .sc{font-weight:800;text-align:right}
.brow .dy{text-align:right;color:var(--muted)}
.steamers.many{grid-template-columns:repeat(3,1fr)}
@media (max-width:760px){
  .work{grid-template-columns:1fr}
  .steam-panel{order:-1}
  .seats{gap:6px}
  .seat{min-height:150px;padding:6px 4px 8px}
  .face{width:46px;height:46px}
  .bubble .dimg{width:38px}
  .bubble .nm{font-size:10.5px}
  .foldzone{height:250px}
  .steamers{grid-template-columns:repeat(4,1fr);gap:6px}
  .steamers.many{grid-template-columns:repeat(3,1fr)}
  .mchip{white-space:nowrap;font-size:11.5px;padding:9px 1px}
  .mins{gap:5px}
  .brow{grid-template-columns:34px 1fr 96px 46px;padding:9px 10px;font-size:13px}
  .steamer{padding:6px 4px}
  .basket{width:66px;height:66px;box-shadow:inset 0 0 0 4px #b8893f,0 3px 0 #a97c3c}
  .basket .dimg{width:46px}
  .basket .tag{font-size:9px}
  .slabel{font-size:10px}
  .gauge{height:9px}
  .needle{height:15px;top:-3px}
  .chip{min-width:58px;padding:5px 9px}
  .chip b{font-size:15px}
  .chip.target{min-width:120px}
  .brand{font-size:22px}
  .summary b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- TITLE -->
<section id="title" class="screen on">
  <div class="card title-card">
    <div class="langs" data-langs></div>
    <div class="logo"><h1>蒸心</h1><div class="seal">台灣<br>手作</div></div>
    <div class="sub">Zheng Xin · ซึงซิน</div>
    <div class="tagline" data-t="tagline"></div>
    <div class="hero-badges" id="heroArt"></div>
    <div class="howto">
      <h3 data-t="howTitle"></h3>
      <ol id="howList"></ol>
      <div class="tip" data-t="keys"></div>
    </div>
    <div class="auth" id="authBox"></div>
    <div class="auth setbox">
      <div class="set-head">⚙️ <b data-t="settings"></b></div>
      <div class="set-lbl" data-t="dayLen"></div>
      <div class="mins minsRow"></div>
      <div class="set-lbl" data-t="sound"></div>
      <div class="mins two"><button class="mchip" data-sound="1"></button><button class="mchip" data-sound="0"></button></div>
      <p class="muted small" data-t="lenNoteTitle"></p>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="big-btn" id="contBtn" style="display:none"></button>
      <button class="big-btn alt" id="startBtn" data-t="newGame"></button>
      <button class="ghost-btn" data-board="title">🏆 <span data-t="board"></span></button>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="hud">
    <div class="brand"><img alt="" data-img="xlb">蒸心<div class="seal">台灣<br>手作</div></div>
    <div class="chip"><small data-t="dayLbl"></small><b id="hudDay"></b></div>
    <div class="chip" id="timeChip"><small data-t="time"></small><b id="hudTime"></b></div>
    <div class="chip"><small data-t="money"></small><b id="hudMoney"></b></div>
    <div class="chip target"><small data-t="target"></small><b id="hudTarget"></b><div class="tbar"><i id="hudTbar"></i></div></div>
    <div class="chip"><small data-t="hearts"></small><b class="hearts" id="hudHearts"></b></div>
    <div class="spacer"></div>
    <button class="icon-btn" data-settings>⚙️ <span data-t="settings"></span></button>
    <button class="icon-btn" id="muteBtn"></button>
    <div class="langs" data-langs></div>
  </div>

  <div class="counter"><img class="hang l" alt="" data-img="xlb"><img class="hang r" alt="" data-img="shumai"><div class="seats" id="seats"></div></div>

  <div class="work">
    <div class="panel">
      <h2 data-t="prepTitle"></h2>
      <div class="menu-row" id="menuRow"></div>
      <div class="foldzone" id="foldZone">
        <img class="bgbadge" id="foldBadge" alt=""><div class="count" id="foldCount"></div>
        <div id="foldArt"></div>
        <div class="hint" id="foldHint"></div>
      </div>
    </div>
    <div class="panel steam-panel">
      <h2 data-t="steamTitle"></h2>
      <div class="steamers" id="steamers"></div>
      <div class="handrow">
        <div class="hand" id="hand"></div>
        <button class="trash" id="trashBtn" data-t="trash"></button>

let AC = null, muted = false;
try{ muted = localStorage.getItem('zx-mute') === '1'; }catch(e){}
function tone(f, d, type = 'sine', vol = .12, delay = 0){
  if(muted) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .02);
  }catch(e){}
}
const sfx = {
  tap(){ tone(700 + Math.random() * 120, .05, 'triangle', .07); },
  done(){ tone(660, .1, 'triangle'); tone(880, .14, 'triangle', .12, .08); },
  pick(){ tone(520, .08, 'sine'); },
  coin(){ tone(988, .08, 'square', .06); tone(1319, .18, 'square', .06, .07); },
  bad(){ tone(180, .22, 'sawtooth', .07); },
  squish(){
    tone(200 + Math.random() * 60, .07, 'sine', .06);
    if(muted) return;
    try{
      if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      const n = Math.floor(AC.sampleRate * .1), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
      const src = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = buf; fl.type = 'lowpass'; fl.frequency.value = 700 + Math.random() * 500; g.gain.value = .5;
      src.connect(fl).connect(g).connect(AC.destination); src.start();
    }catch(e){}
  },
  ding(){ tone(1046, .25, 'sine', .08); }
};

function writeMyDoc(mutate){
  if(!signedIn() || ON.writeBlocked) return;
  queueWrite(async () => {
    const base = ON.myDoc ? {name:ON.myDoc.name || '', days:{...(ON.myDoc.days || {})}} : {name:'', days:{}};
    const changed = mutate(base);
    if(!changed) return;

    base.updated = new Date().toISOString();

function submitScore(earned, day, served){
  const date = bkkDate();
  writeMyDoc(doc => {
    const cur = doc.days[date];
    const name = (ON.nick || ON.profileName || '').slice(0, 16);
    const mins = curDayLen() / 60, rate = Math.round(earned / mins);
    const curRate = cur ? (typeof cur.rate === 'number' ? cur.rate : Math.round(cur.best / 1.25)) : -1;
    const better = rate > curRate;
    if(!better && cur && (cur.day || 0) >= day && doc.name === name) return false;
    doc.name = name;
    doc.days[date] = better
      ? {best:earned, mins, rate, day:Math.max(day, cur ? cur.day || 0 : 0), served}
      : {...cur, rate:curRate, day:Math.max(day, cur.day || 0)};
    return true;
  });
}

/* ================= state ================= */
let S = null, last = 0;
const $ = s => document.querySelector(s);

function newGame(){
  S = {day:1, money:0, total:0, hearts:5, totalServed:0, unlocked:new Set(['pork','shrimp']), upg:new Set()};
  startDay();
}
function steamCount(){ return 2 + ['steam3','steam4','steam5','steam6'].filter(k => S.upg.has(k)).length; }
function spawnInterval(){ return Math.max(2.3, 5.6 - 0.16 * (S.day - 1)); }
function maxPatience(){ return Math.max(16, 30 - 0.5 * (S.day - 1)) * (S.upg.has('tea') ? 1.3 : 1) * (S.upg.has('dessert') ? 1.2 : 1); }

function startDay(){
  S.snapshot = snapshotOf(S);
  persistSave(S.snapshot);
  Object.assign(S, {
    dayLen:dayMins * 60, time:dayMins * 60, paused:false, earned:0, served:0, lost:0, customers:[null,null,null,null], spawnT:1.2,
    steamers:Array(steamCount()).fill(null), hand:null,
    prep:{item:S.prep ? S.prep.item : 'pork', pleats:0, ready:false}, running:true
  });
  show('game'); renderAll();
  last = performance.now();
  requestAnimationFrame(loop);
}

function spawnCustomer(i){
  const pool = ITEM_ORDER.filter(k => S.unlocked.has(k));
  // newer recipes are a bit more popular
  const weights = pool.map(k => ITEMS[k].cost ? 1.4 : 1);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0), item = pool[0];
  for(let j = 0; j < pool.length; j++){ r -= weights[j]; if(r <= 0){ item = pool[j]; break; } }
  const max = maxPatience() * (0.9 + Math.random() * 0.2);
  S.customers[i] = {item, p:max, max, look:{
    skin:SKINS[Math.floor(Math.random() * SKINS.length)],
    hair:HAIRS[Math.floor(Math.random() * HAIRS.length)],
    style:Math.floor(Math.random() * 3)}};
  sfx.ding();
  renderSeats();
}

/* ================= loop ================= */
function loop(now){
  if(!S || !S.running) return;
  if(S.paused){ last = now; requestAnimationFrame(loop); return; }
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  update(dt);
  if(S.running) frameRender();
  if(S.running) requestAnimationFrame(loop);
}
function update(dt){
  S.time -= dt;
  if(S.time <= 0){ S.time = 0; endDay(); return; }
  S.spawnT -= dt;
  if(S.spawnT <= 0 && S.time > 6){
    const idx = S.customers.findIndex(c => !c);
    if(idx >= 0){ spawnCustomer(idx); S.spawnT = spawnInterval() * (0.75 + Math.random() * 0.5); }
    else S.spawnT = 0.6;
  }
  let changed = false;
  for(let i = 0; i < 4; i++){
    const c = S.customers[i]; if(!c) continue;
    c.p -= dt;
    if(c.p <= 0){
      S.customers[i] = null; S.hearts--; S.lost++; changed = true;
      toast(L().angry, 'bad'); sfx.bad();
      if(S.hearts <= 0){ renderHud(); gameOver('hearts'); return; }
    }
  }
  if(changed){ renderSeats(); renderHud(); }
  S.steamers.forEach(s => {
    if(!s) return;
    const before = s.t / ITEMS[s.item].cook;
    s.t += dt;
    const after = s.t / ITEMS[s.item].cook;
    if(before < PERF_LO && after >= PERF_LO) sfx.ding();
    if(before < BURN && after >= BURN) sfx.bad();
  });
}

      const [hx, hy] = pt(R - 3, a + 5), [hcx, hcy] = pt((R + rIn) / 2, a + 12);

    }
  }

}
function buildStage(){

      <radialGradient id="sheen" cx="35%" cy="28%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <filter id="tex" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .28  0 0 0 .55 -.18" result="sp"/><feComposite in="sp" in2="SourceAlpha" operator="in" result="sp2"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sp2"/></feMerge></filter>
      <filter id="lumpy" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="12" xChannelSelector="R" yChannelSelector="G"/></filter>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6b4a2e" flood-opacity=".3"/></filter>
    </defs>
    <circle cx="150" cy="150" r="138" fill="#fff" opacity=".35"/>
    <g id="rotG" class="rot">
      <g filter="url(#shadow)"><g filter="url(#tex)"><path id="wrapper" fill="url(#skin)" stroke="rgba(170,128,78,.4)" stroke-width="1.5"/></g></g>
      <g>${fillingSVG(it)}</g>
      <g filter="url(#tex)" id="pleats"></g>
    </g>
    <g id="flapWrap" filter="url(#shadow)"><path id="flap" fill="url(#flapG)" stroke="rgba(160,120,70,.45)" stroke-width="1.5"/><path id="flapLine" stroke="rgba(150,105,55,.5)" stroke-width="3" stroke-linecap="round" fill="none"/></g>
    <circle cx="150" cy="150" r="118" fill="url(#sheen)" pointer-events="none"/>

  </svg>`;
  stage.item = p.item; stage.k = -1;
  const rot = $('#rotG'); rot.style.transition = 'none';
  updateStage();
  void rot.getBoundingClientRect(); rot.style.transition = '';
}
function updateStage(){
  const p = S.prep, g = stageGeom(p.item, p.pleats);
  if(stage.k === p.pleats) return;
  $('#wrapper').setAttribute('d', rimPath(g.R, p.pleats, g.step));
  $('#pleats').innerHTML = pleatsSVG(g, p.pleats);
  $('#rotG').style.transform = `rotate(${-p.pleats * g.step}deg)`;
  $('#guidePos').setAttribute('transform', `translate(0 ${f1(g.R - 122)})`);
  stage.k = p.pleats;
}
function drawFlap(p){
  const flap = document.getElementById('flap'), line = document.getElementById('flapLine'), st = document.getElementById('stage');
  if(!flap) return;
  if(p <= 0){ flap.setAttribute('d', ''); line.setAttribute('d', ''); st.style.transform = ''; return; }
  const g = stageGeom(S.prep.item, S.prep.pleats), half = g.step * 0.75;
  const [x0, y0] = pt(g.R, 90 - half), [x1, y1] = pt(g.R, 90 + half);
  const target = g.it.type === 'xlb' ? g.rIn + 14 : g.rIn + 4;
  const ay = CY + g.R - p * (g.R - target) * 0.92, bow = 10 * (1 - p);
  flap.setAttribute('d', `M${f1(x0)} ${f1(y0)} Q150 ${f1(CY + g.R + 8 * (1 - p))} ${f1(x1)} ${f1(y1)} Q${f1(150 - bow)} ${f1((y1 + ay) / 2)} 150 ${f1(ay)} Q${f1(150 + bow)} ${f1((y0 + ay) / 2)} ${f1(x0)} ${f1(y0)}Z`);
  line.setAttribute('d', `M150 ${f1(CY + g.R - 2)} L150 ${f1(ay + 4)}`);
  st.style.transform = `scale(${1 + .03 * p}, ${1 - .04 * p})`;
}
function commitPleat(){
  if(!S || !S.running || S.paused) return false;
  const p = S.prep;
  if(!p.item){ toast(L().pickItem); return false; }
  if(p.ready || (p.flash && performance.now() < p.flash.until)) return false;
  const need = ITEMS[p.item].pleats;
  p.pleats = Math.min(need, p.pleats + (S.upg.has('hands2') ? 3 : S.upg.has('hands') ? 2 : 1));
  sfx.squish();
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  const st = $('#stage'); if(st){ st.classList.remove('squish'); void st.getBoundingClientRect(); st.classList.add('squish'); }
  if(p.pleats >= need){
    p.flash = {item:p.item, until:performance.now() + 600};
    p.ready = true; sfx.done();
    setTimeout(() => { if(S && S.running) renderPrep(); }, 620);
    tryLoadPrep(false);
  }
  renderPrep();
  return true;
}
function fold(){
  if(!S || !S.running) return;
  if(S.prep.ready && !(S.prep.flash && performance.now() < S.prep.flash.until)){ tryLoadPrep(true); return; }
  drawFlap(.7); setTimeout(() => { drawFlap(0); commitPleat(); }, 70);
}
function tryLoadPrep(warn){
  const p = S.prep; if(!p.ready) return;
  const i = S.steamers.findIndex(s => !s);
  if(i < 0){ if(warn !== null) toast(L().steamersFull, 'bad'); renderPrep(); return; }
  S.steamers[i] = {item:p.item, t:0};
  p.pleats = 0; p.ready = false;
  renderSteamers(); renderPrep();
}
function clickSteamer(i){
  if(!S.running) return;
  const s = S.steamers[i]; if(!s) return;
  const r = s.t / ITEMS[s.item].cook;
  if(r >= BURN){ S.steamers[i] = null; toast(L().burnt, 'bad'); renderSteamers(); tryLoadPrep(null); return; }
  if(r < PERF_LO){ toast(L().notReady); return; }
  if(S.hand){ toast(L().handsFull, 'bad'); return; }
  S.hand = {item:s.item, q: r <= PERF_HI ? 'perfect' : 'over'};
  S.steamers[i] = null; sfx.pick();
  renderSteamers(); renderHand(); renderSeats(); tryLoadPrep(null);
}
function clickSeat(i){
  if(!S.running) return;
  const c = S.customers[i]; if(!c) return;
  if(!S.hand){ toast(L().noHand); return; }
  if(S.hand.item !== c.item){ toast(L().wrong, 'bad'); sfx.bad(); return; }
  const price = priceOf(c.item), ratio = Math.max(0, c.p / c.max);
  const pay = S.hand.q === 'perfect' ? price + Math.round(price * 0.35 * ratio) : Math.round(price * 0.6);
  S.money += pay; S.earned += pay; S.total += pay; S.served++; S.totalServed++;
  floatText(document.querySelector(`.seat[data-i="${i}"]`), '+฿' + pay);
  toast(S.hand.q === 'perfect' ? L().perfect : L().over, S.hand.q === 'perfect' ? 'good' : '');
  S.customers[i] = null; S.hand = null; sfx.coin();
  renderSeats(); renderHand(); renderHud();
}
function discard(){
  if(!S.running || !S.hand) return;
  S.hand = null; toast(L().discarded); renderHand(); renderSeats();
}

/* ================= day flow ================= */
function endDay(){
  S.running = false;
  submitScore(S.earned, S.day, S.served);
  const target = targetOf(S.day);
  if(S.earned < target){ gameOver('target'); return; }
  if(S.day >= DAYS){ persistSave(null); showEnd(true); return; }
  renderShop(); show('shop');
}
function gameOver(reason){ S.running = false; S.reason = reason; if(reason === 'hearts') submitScore(S.earned, S.day, S.served); showEnd(false); }
function retryDay(){ if(S && S.snapshot) loadGame(S.snapshot); }
function nextDay(){ S.day++; S.hearts = Math.min(5, S.hearts + 1); startDay(); toast(L().heartBack, 'good'); }
function buy(key){
  if(ITEMS[key]){
    const c = ITEMS[key].cost;
    if(S.unlocked.has(key) || S.money < c) return;
    S.money -= c; S.unlocked.add(key);
  } else {
    const u = UPGRADES[key];
    if(S.upg.has(key) || S.money < u.cost || (u.req && !S.upg.has(u.req))) return;
    S.money -= u.cost; S.upg.add(key);
  }
  sfx.coin(); renderShop();
}

    }

function frameSteamers(){
  S.steamers.forEach((s, i) => {
    if(!s) return;

    const r = s.t / ITEMS[s.item].cook;
    el.querySelector('.needle').style.left = Math.min(100, r / BURN * 100) + '%';
    const zone = r < PERF_LO ? 'raw' : r <= PERF_HI ? 'ok' : r < BURN ? 'over' : 'burnt';
    if(s.zone !== zone){
      s.zone = zone;
      el.classList.toggle('ok', zone === 'ok');
      el.classList.toggle('burnt', zone === 'burnt');
      el.querySelector('.basket').innerHTML = `<div class="steam"><span></span><span></span><span></span></div>` +
        dumplingSVG(s.item, null, {raw: zone === 'raw', over: zone === 'over', burnt: zone === 'burnt'});

/* ================= feedback ================= */
let toastTimer;
function toast(msg, cls = ''){
  const el = $('#toast');
  el.textContent = msg; el.className = 'show ' + cls;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = cls, 1300);
}
function floatText(el, txt){
  if(!el) return;
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'floater'; f.textContent = txt;
  f.style.left = (r.left + r.width / 2 - 28) + 'px'; f.style.top = (r.top + 20) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if(lb){ lang = lb.dataset.lang; try{ localStorage.setItem('zx-lang', lang); }catch(_){} renderAll(); return; }
  const mb = e.target.closest('[data-item]'); if(mb){ selectItem(mb.dataset.item); return; }
  const st = e.target.closest('[data-s]'); if(st){ clickSteamer(+st.dataset.s); return; }
  const se = e.target.closest('.seat[data-i]'); if(se){ clickSeat(+se.dataset.i); return; }
  const bb = e.target.closest('[data-buy]'); if(bb){ buy(bb.dataset.buy); return; }
  if(e.target.closest('#nextBtn')){ nextDay(); return; }
  if(e.target.closest('[data-settings]')){ openSettings(); return; }
  if(e.target.closest('#setClose') || e.target.id === 'settings'){ closeSettings(); return; }
  const mc = e.target.closest('[data-mins]'); if(mc){ setMins(+mc.dataset.mins); return; }
  const sc = e.target.closest('[data-sound]'); if(sc){ muted = sc.dataset.sound !== '1'; try{ localStorage.setItem('zx-mute', muted ? '1' : '0'); }catch(_){} applyStatic(); renderSettings(); return; }
  if(e.target.closest('#retryBtn')){ newGame(); return; }
  if(e.target.closest('#retryDayBtn')){ retryDay(); return; }
  if(e.target.closest('#menuBtn')){ S = null; show('title'); applyStatic(); renderAuth(); return; }
  const bd = e.target.closest('[data-board]'); if(bd){ openBoard(bd.dataset.board); return; }
  const dc = e.target.closest('[data-date]'); if(dc){ ON.boardDate = dc.dataset.date; renderBoard(); return; }
  if(e.target.closest('#boardBackBtn')){ show(ON.boardBack); if(ON.boardBack === 'title') renderAuth(); return; }
  if(e.target.closest('#nickBtn')){ saveNick(); return; }
  if(e.target.closest('#contBtn')){ const sv = currentSave(); if(sv){ sfx.ding(); loadGame(sv); } return; }
});
const fz = $('#foldZone');
fz.addEventListener('pointerdown', e => {
  if(!S || !S.running) return;
  e.preventDefault();
  if(!S.prep.item){ toast(L().pickItem); return; }
  if(S.prep.ready && !(S.prep.flash && performance.now() < S.prep.flash.until)){ tryLoadPrep(true); return; }
  drag = {y0:e.clientY, id:e.pointerId}; flapP = 0;
  try{ fz.setPointerCapture(e.pointerId); }catch(_){}
  fz.classList.add('dragging');
});
fz.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  const st = $('#stage'); if(!st){ return; }
  const scale = st.getBoundingClientRect().width / 300;
  const p = Math.max(0, Math.min(1, (drag.y0 - e.clientY) / scale / 40));
  if(p >= 1){ drawFlap(0); flapP = 0; commitPleat(); drag.y0 = e.clientY; return; }
  if(p < flapP - .25 && flapP < .6){ drag.y0 = Math.max(drag.y0, e.clientY); }
  flapP = p; drawFlap(p);
});
const endDrag = () => {
  if(!drag) return;
  if(flapP >= .55) commitPleat();
  drawFlap(0); flapP = 0; drag = null; fz.classList.remove('dragging');
};
fz.addEventListener('pointerup', endDrag);
fz.addEventListener('pointercancel', endDrag);
fz.addEventListener('lostpointercapture', endDrag);
$('#startBtn').addEventListener('click', () => { sfx.ding(); newGame(); });
document.addEventListener('keydown', e => { if(e.target && e.target.id === 'nickInput' && e.key === 'Enter') saveNick(); });
$('#trashBtn').addEventListener('click', discard);
$('#muteBtn').addEventListener('click', () => {
  muted = !muted; try{ localStorage.setItem('zx-mute', muted ? '1' : '0'); }catch(_){}
  applyStatic();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('#settings').hidden){ closeSettings(); return; }
  if(!S || !S.running || S.paused || (e.target && e.target.tagName === 'INPUT')) return;
  if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat) fold(); }
  else if(/^Digit[1-4]$/.test(e.code)){ const i = +e.code.slice(5) - 1; if(i < S.steamers.length) clickSteamer(i); }
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });

$('#heroArt').innerHTML = `<img class="badge" src="${IMG.xlb}" alt="Xiaolongbao"><img class="badge" src="${IMG.shumai}" alt="Shumai">`;
document.querySelectorAll('[data-img]').forEach(el => el.src = IMG[el.dataset.img]);
applyStatic();
renderSettings();
renderAuth();
initOnline();
</script>
